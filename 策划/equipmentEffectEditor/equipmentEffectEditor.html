<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>装备编辑器</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#192332;--line:#354459;--accent:#64d9c5;--muted:#9dadc1}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:#e6edf5;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit;background:#142030;border:1px solid var(--line);border-radius:7px;padding:8px 11px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}input,select,textarea{max-width:100%}input,textarea{width:100%}textarea{min-height:84px;resize:vertical}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:20px 26px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0 auto 0 0}header small{color:var(--muted);font-size:12px;display:block}.primary{background:#167865;border-color:#27a78e}.danger{color:#ffafb9}#status{padding:10px 26px;min-height:43px;background:#122d30;color:#c1eee5;white-space:pre-wrap}#status.error{background:#44242a;color:#ffd5da}main{display:grid;grid-template-columns:290px minmax(0,1fr)}aside{padding:20px;border-right:1px solid var(--line);height:calc(100vh - 144px);overflow:auto;position:sticky;top:0}aside input,aside select{width:100%;margin-bottom:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}#equipmentList button{width:100%;text-align:left;margin-top:9px;padding:12px}#equipmentList small{display:block;color:var(--muted)}#equipmentList .selected{border-color:var(--accent);background:#21453f}article{padding:24px 30px;max-width:1260px;width:100%}h2{font-size:18px;margin:26px 0 12px}label{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.wide{grid-column:1/-1}.muted{color:var(--muted)}.help-button{width:22px;height:22px;padding:0;border-radius:50%;color:var(--accent);font-weight:bold;font-size:13px;line-height:20px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row select{flex:1;min-width:180px}.panel{border:1px solid var(--line);padding:18px;border-radius:10px;background:var(--panel)}.effect{border:1px solid #41556c;background:#172231;padding:15px;border-radius:9px;margin:12px 0}.effect-header{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.effect-header strong{margin-right:auto}.effect-header button{padding:4px 9px}.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:15px}.params select{width:100%}.params label{font-size:13px}.branch{margin:14px 0 0 12px;padding-left:14px;border-left:2px solid #507a75}.branch h3{font-size:14px;color:var(--accent);margin:10px 0}.code{font-family:Consolas,monospace;min-height:220px;line-height:1.5}summary{cursor:pointer;color:var(--accent);margin:8px 0}dialog{background:var(--panel);color:#e6edf5;border:1px solid var(--line);border-radius:12px;max-width:640px;width:calc(100% - 40px);max-height:80vh;overflow:auto;padding:24px}dialog::backdrop{background:#0009}dialog h2{margin-top:0}#helpBody{white-space:pre-wrap}#empty{padding:35px;text-align:center;color:var(--muted)}.pill{font-size:12px;color:var(--accent)}#recipePreview,#references{margin:12px 0 0}#count{margin:10px 0;color:var(--muted)}@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;height:auto;max-height:350px;border-right:0;border-bottom:1px solid var(--line)}article{padding:20px}.grid{grid-template-columns:1fr}header{padding:16px}.branch{margin-left:0;padding-left:10px}}
</style>
</head>
<body>
<header><h1>装备编辑器<small>19_Equipment.xlsx · 配置与合成配方</small></h1><button id="reload">重新读取 Excel</button><button id="save" class="primary">保存并生成配置</button><button id="export">导出 JSON 备份</button></header>
<div id="status" role="status">正在读取装备表…</div>
<main>
<aside><label for="search">搜索装备</label><input id="search" placeholder="名称、描述、编号"><label for="filterType">类型筛选</label><select id="filterType"><option value="">全部类型</option></select><div class="toolbar"><button id="add">＋ 新增装备</button><button id="duplicate">复制当前</button></div><p id="count"></p><div id="equipmentList"></div></aside>
<article>
<div id="empty" hidden>暂无装备，点击“新增装备”开始编辑。</div>
<div id="editor">
<div class="grid panel">
<div><label for="id">编号（id）<button class="help-button" data-help="id">!</button></label><input id="id" type="number" min="190001" max="199999" disabled></div>
<div><label for="name">装备名字（name）</label><input id="name"></div>
<div><label for="type">装备类型（type）<button class="help-button" data-help="type">!</button></label><select id="type"></select></div>
<div><label for="price">价格（price）<button class="help-button" data-help="price">!</button></label><input id="price" type="number" min="0" step="1"></div>
<div class="wide"><label for="effectDes">装备效果描述（effectDes）<button class="help-button" data-help="effectDes">!</button></label><textarea id="effectDes" placeholder="玩家看到的效果说明"></textarea></div>
<div class="wide"><label for="des">装备描述（des）<button class="help-button" data-help="des">!</button></label><textarea id="des" placeholder="装备背景、故事或外观描述"></textarea></div>
</div>
<h2>合成配方（combine）<button class="help-button" data-help="combine">!</button></h2>
<div class="panel"><label><input id="canCombine" type="checkbox" style="width:auto">通过两件材料合成</label><div id="recipe" class="grid"><div><label for="material1">材料一（combine[0]）</label><select id="material1" style="width:100%"></select></div><div><label for="material2">材料二（combine[1]）</label><select id="material2" style="width:100%"></select></div></div><p id="recipePreview" class="muted"></p><p id="references" class="muted"></p></div>
<h2>装备效果（effect）<button class="help-button" data-help="effect">!</button></h2>
<p class="muted">SELF 为装备持有者，ENEMY 为唯一敌人。现有空效果保持为空；支持条件、重复及事件触发等嵌套配置。</p>
<div class="row"><select id="effectType"></select><button id="addEffect">＋ 添加效果</button></div>
<div id="effects"></div>
<details><summary>完整效果 JSON（effect）<button class="help-button" data-help="json">!</button></summary><textarea id="effectJson" class="code" spellcheck="false"></textarea><div class="row"><button id="applyJson">应用 JSON</button><span class="muted">保存时会一并检查尚未应用的 JSON。</span></div></details>
<div class="row" style="margin-top:30px"><button id="remove" class="danger">删除当前装备</button><span id="sources" class="muted"></span></div>
</div>
</article>
</main>
<dialog id="helpDialog"><h2 id="helpTitle"></h2><div id="helpBody"></div><button id="closeHelp" style="margin-top:18px">关闭</button></dialog>
<script src="/equipmentEffectEditor.js"></script>
</body></html>
