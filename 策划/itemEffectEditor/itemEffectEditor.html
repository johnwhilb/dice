<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道具效果编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:14px system-ui}header{padding:18px 24px;background:#1f2937;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 auto 0 0}button,input,select,textarea{font:inherit;color:inherit;background:#243247;border:1px solid #42536c;border-radius:7px;padding:9px}button{cursor:pointer}button:hover{border-color:#56b6bd}button:disabled{opacity:.5;cursor:default}.primary{background:#147d83}main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 90px)}aside{padding:18px;border-right:1px solid #334155;max-height:calc(100vh - 90px);overflow:auto}article{padding:24px;max-width:1200px;width:100%}aside button{display:block;width:100%;text-align:left;margin:8px 0}.selected{border-color:#5eead4;background:#264a50}input,textarea{width:100%}textarea{min-height:100px;font-family:monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;margin-bottom:7px}.wide{grid-column:1/-1}.muted{color:#94a3b8}#status{padding:10px 24px;background:#0d363a;min-height:38px}.effect{border:1px solid #41536a;border-radius:9px;margin:12px 0;padding:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row strong{margin-right:auto}.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}details{margin-top:10px}summary{cursor:pointer;color:#67e8f9}.help{padding:8px;margin:8px 0;background:#1f2937}.danger{color:#fda4af}#enemyInfo{white-space:pre-wrap}#itemList small{display:block;color:#94a3b8;margin-top:4px}@media(max-width:750px){main{grid-template-columns:1fr}aside{max-height:300px}.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>道具效果编辑器</h1><button id="reload">重新读取 Excel</button><button id="save" class="primary">保存到表格</button><button id="export">导出 JSON 备份</button></header>
<div id="status" role="status">正在读取道具表和敌人表…</div>
<main><aside><label>道具搜索</label><input id="search" placeholder="名称、描述、编号"><button id="add">＋ 新增道具</button><div id="itemList"></div></aside><article>
<div class="grid"><div><label>编号（id）</label><input id="id" type="number"></div><div><label>名称（name）</label><input id="name"></div><div class="wide"><label>描述（des）</label><textarea id="des"></textarea></div><div><label>使用目标（target）</label><select id="target"><option>SELF</option><option>ENEMY</option></select></div><div><label>价格（price）</label><input id="price" type="number" min="1" step="1"></div><div><label>道具类型（type）</label><select id="type"><option value="ATTACK">攻击 ATTACK</option><option value="SKILL">技能 SKILL</option><option value="POWER">持续能力 POWER</option></select></div></div>
<details class="help"><summary>！道具使用和 JSON 效果说明</summary><p>道具没有骰子条件、费用或等级。SELF 指使用者，ENEMY 指唯一敌人。效果按数组顺序执行，可使用条件、重复、延迟和持续触发；与卡牌使用相同的 effect 格式。这里编辑配置，游戏中的道具获得、持有和使用入口仍需要对应运行时代码。</p></details>
<h2>效果（effect）</h2><div class="row"><select id="effectType"></select><button id="addEffect">＋ 添加效果</button><button id="remove" class="danger">删除当前道具</button></div><div id="effects"></div>
<details><summary>编辑完整效果 JSON（支持嵌套）</summary><textarea id="effectJson" style="height:240px"></textarea><button id="applyJson">应用效果 JSON</button></details>
<h2>敌人掉落（itemRewad）</h2><p class="muted">保留敌人表已有字段名 itemRewad。选择敌人后，可指定或移除其掉落道具。</p><div class="row"><select id="enemy"></select><select id="drop"></select><button id="assign">设置掉落</button></div><p id="enemyInfo" class="muted"></p><p id="sources"></p>
</article></main><script src="/effectCatalog.js"></script><script src="/itemEffectEditor.js"></script></body></html>
