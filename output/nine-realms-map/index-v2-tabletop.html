<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>九界行记 · 手游世界地图</title>
<style>
:root{--navy:#133b40;--gold:#cfad69;--paper:#f5e8c9;--ink:#302d25;--purple:#714986}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#102b2e;display:grid;place-items:center;font-family:"KaiTi","STKaiti","Microsoft YaHei",serif;color:var(--ink)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #f8d779;outline-offset:3px}#frame{position:relative;overflow:hidden;flex:none}#game{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;overflow:hidden;background:#17464b}
#board{position:absolute;inset:28px 0 24px;background:url("mobile-continent.png") center/100% 100% no-repeat}#board:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#092c2d15,transparent 25%,transparent 80%,#092c2d20)}
.hud{position:absolute;z-index:10;top:0;left:0;right:0;height:62px;padding:9px 30px;display:flex;align-items:center;gap:25px;color:var(--paper);background:linear-gradient(90deg,#12363bf5,#184348ed);border-bottom:1px solid #cfad6980;box-shadow:0 3px 10px #152a2c35}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}.seal{font-size:30px;color:#e0bc70;border:1px solid #b89d62;width:39px;height:39px;display:grid;place-items:center;transform:rotate(45deg)}.seal span{transform:rotate(-45deg)}h1{font-size:25px;letter-spacing:4px;margin:0;font-weight:normal}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#c3b697;margin-top:2px}.day{display:flex;align-items:center;gap:9px}.day strong{font-size:30px;font-weight:normal;color:#efce8b}.day span{font-size:15px}.day small{display:block;font-size:12px;color:#cec5aa;margin-top:2px}.divider{height:27px;width:1px;background:#c5ae7550}.daily{font-size:16px;color:#efce8b}.daily small{font-size:12px;color:#d0c8b2;display:block;margin-top:3px}.goal{font-size:15px}.goal b{font-size:25px;font-weight:normal;color:#e7cb8d;vertical-align:middle;margin-left:10px}.goal small{display:block;font-size:11px;color:#c9bfa2;margin-top:2px}
#fate{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none;z-index:1;opacity:.75}.fate-shadow{fill:none;stroke:#70593c;stroke-width:4;stroke-dasharray:6 8}.fate-line{fill:none;stroke:#f7dda1;stroke-width:2;stroke-dasharray:6 8}
.kingdom{position:absolute;z-index:3;width:204px;height:170px;transform:translate(-50%,-50%);background:transparent;border:0;color:var(--ink);padding:0;text-align:center;touch-action:manipulation}
.art{width:128px;height:128px;margin:-5px auto -4px;display:block;background-image:url("kingdom-landmarks.png");background-size:300% 300%;background-repeat:no-repeat;filter:drop-shadow(0 4px 3px #38342648);transition:transform .18s,filter .18s;pointer-events:none}
.kingdom:before{content:"";position:absolute;width:124px;height:37px;border:1px solid transparent;border-radius:50%;top:84px;left:40px;z-index:-1}.kingdom.selected:before{border-color:#f4d681;box-shadow:0 0 0 2px #6f512b80,0 0 13px 4px #efd79277;background:#e8c98733}.kingdom.selected .art{transform:translateY(-3px);filter:drop-shadow(0 0 4px #ffe8a1) drop-shadow(0 4px 3px #38342648)}.kingdom:hover .art{transform:translateY(-3px)}
.name{display:table;margin:0 auto;position:relative;white-space:nowrap;font-size:19px;line-height:25px;padding:0 11px;background:linear-gradient(90deg,#ecdfbd00,#f6eacbe8 9%,#f6eacbf2 91%,#ecdfbd00);text-shadow:0 1px #fff6de;font-weight:bold;letter-spacing:.3px}
.info{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px;margin:2px 0 0;background:#f4e8d1ec;border:1px solid #88734a70;border-radius:3px;box-shadow:0 2px 3px #3e38271c;font-size:14px;line-height:18px;white-space:nowrap}.info .floor{color:#75654e;font-size:13px;padding-right:5px;border-right:1px solid #9b89644d}.type{font-weight:bold}.anomaly .info{border-color:#78548caa;background:#ebe0f0f2}.anomaly .type{color:#73438b}.cleared .info{background:#e3ebd5ef;border-color:#58785299}.cleared .type{color:#3e6542}.boss .type{color:#8a3b37}
.tag{position:absolute;top:21px;right:19px;background:#75508beF;color:#f7effa;border:1px solid #e1c9ee;border-radius:3px;padding:3px 6px;font-size:13px;line-height:16px;box-shadow:0 2px 4px #302c3f33}.questbadge{position:absolute;top:45px;left:25px;font-size:15px;color:#65471c;background:#efd396;border:1px solid #947343;padding:1px 5px;transform:rotate(-6deg)}.cleared .tag{background:#527951;border-color:#cbdcb3}
#footer{position:absolute;z-index:10;bottom:0;left:0;right:0;height:74px;background:linear-gradient(90deg,#10383ef9,#173f43f5);color:#e8dfc7;border-top:1px solid #b89c625f;display:flex;align-items:center;gap:20px;padding:10px 27px}
.quest{display:flex;align-items:center;gap:10px;min-width:280px;border-right:1px solid #ceb5734d;padding-right:20px}.questicon{font-size:31px;color:#dbbb77}.questtitle{font-size:16px;color:#f0dcaf}.quest small{display:block;font-size:12px;color:#bdbca8;margin-top:4px}.quest button{background:transparent;border:1px solid #aa965d;border-radius:3px;font-size:12px;padding:5px 8px;color:#e9ce94}
.selectedsummary{flex:1;min-width:0}.selectedsummary strong{font-size:17px;color:#f0ddad;font-weight:normal}.selectedsummary span{font-size:14px;color:#e3d2b3;margin-left:10px}.selectedsummary small{display:block;font-size:11px;color:#b9bbab;margin-top:6px}#enter{height:44px;min-width:167px;padding:0 21px;border-radius:3px;background:linear-gradient(#ead099,#cba969);border:1px solid #f4dda8;box-shadow:inset 0 0 0 2px #9270394d,0 2px 5px #09262980;color:#3c3326;font-size:19px;letter-spacing:1px}#enter small{font-size:11px;margin-left:9px;opacity:.8}.daily-note{position:absolute;top:75px;left:30px;color:#f0e6cd;font-size:12px;padding:5px 9px;background:#173b40c7;border:1px solid #bc9a5950;border-radius:3px}.daily-note span{color:#d8b7ea}#announce{position:absolute;z-index:8;left:50%;bottom:91px;transform:translateX(-50%);background:#f3e8cfea;border:1px solid #917848;padding:8px 17px;font-size:15px;border-radius:3px;white-space:nowrap;box-shadow:0 3px 8px #233c3540;opacity:0;transition:opacity .2s;pointer-events:none}#announce.show{opacity:1}
</style></head>
<body><main id="frame" aria-label="手游九国大陆地图"><div id="game">
<div id="board" aria-hidden="true"></div>
<header class="hud"><div class="brand"><div class="seal" aria-hidden="true"><span>ᛟ</span></div><div><h1>九界行记</h1><small>诸神黄昏 · 世界探索</small></div></div><div class="day"><strong>43</strong><span>/ 60 天<small>末日倒计时 · 剩余17天</small></span></div><i class="divider"></i><div class="daily">今日可行动 1 次<small>查看、切换王国不耗时</small></div><i class="divider"></i><div class="goal">诸王讨伐<b>1 / 3</b><small>60天内，击败任意三国Boss</small></div></header>
<div class="daily-note"><span>⌛ 今日异动 3 处</span> · 日终消失</div>
<svg id="fate" viewBox="0 0 1280 720" aria-hidden="true"><path class="fate-shadow" d="M 549 202 Q 700 235 824 205 T 744 482"/><path class="fate-line" d="M 549 202 Q 700 235 824 205 T 744 482"/></svg>
<div id="kingdoms"></div>
<div id="announce" role="status" aria-live="polite"></div>
<footer id="footer"><div class="quest"><span class="questicon">◇</span><div><div class="questtitle">止息永冬　1/3</div><small id="quest-state">跨界长任务 · 已暂停</small></div><button id="quest-toggle">继续</button></div><div class="selectedsummary"><strong id="selected-name">米德加德国</strong><span id="selected-event">第5/11层 · 限时异动</span><small id="selected-help">暮鸦的预兆 · 今日结束后消失</small></div><button id="enter">探索异动<small>1天</small></button></footer>
</div></main>
<script>
const realms=[
{id:'alf',name:'阿尔夫海姆国',cell:0,x:248,y:185,layer:6,event:'专属事件',symbol:'✦',description:'光之晶林 · 白塔的回响',action:'触碰符文'},
{id:'vana',name:'华纳海姆国',cell:1,x:536,y:164,layer:11,event:'已征服',symbol:'✓',description:'古树石环 · 世界Boss已击败',cleared:true,action:'重访王国',quest:'① ✓'},
{id:'jotun',name:'约顿海姆国',cell:2,x:844,y:176,layer:2,event:'限时异动',symbol:'⌛',description:'巨人遗骨 · 永冬的裂隙',anomaly:true,action:'探索异动',quest:'②'},
{id:'dwarf',name:'斯瓦塔尔法海姆国',cell:3,x:237,y:385,layer:3,event:'商人',symbol:'¤',description:'熔炉矿坑 · 矮人锻造商队',action:'拜访商人'},
{id:'mid',name:'米德加德国',cell:4,x:609,y:374,layer:5,event:'限时异动',symbol:'⌛',description:'暮鸦的预兆 · 今日结束后消失',anomaly:true,action:'探索异动'},
{id:'asgard',name:'阿斯加德国',cell:5,x:1072,y:322,layer:1,event:'战斗',symbol:'⚔',description:'浮空神殿遗迹 · 失落守卫',action:'挑战守卫'},
{id:'hel',name:'赫尔海姆国',cell:6,x:361,y:551,layer:11,event:'Boss',symbol:'☠',description:'亡灵聚落 · 冥后之门',boss:true,action:'讨伐Boss'},
{id:'nifl',name:'尼福尔海姆国',cell:7,x:701,y:551,layer:8,event:'篝火',symbol:'♨',description:'黑死迷雾聚落 · 寒夜余烬',action:'驻足休整',quest:'③'},
{id:'muspel',name:'穆斯贝尔海姆国',cell:8,x:1024,y:529,layer:2,event:'限时异动',symbol:'⌛',description:'火山巨剑 · 灰烬中的召唤',anomaly:true,action:'探索异动'}
];
const root=document.querySelector('#kingdoms');let selected='mid',paused=true;
function select(id,announce=false){selected=id;const w=realms.find(r=>r.id===id);document.querySelectorAll('.kingdom').forEach(el=>{const active=el.dataset.world===id;el.classList.toggle('selected',active);el.setAttribute('aria-pressed',active)});document.querySelector('#selected-name').textContent=w.name;document.querySelector('#selected-event').textContent=(w.cleared?'11/11 已完成':'第'+w.layer+'/11层')+' · '+w.event;document.querySelector('#selected-help').textContent=w.description;document.querySelector('#enter').innerHTML=w.action+'<small>'+(w.cleared?'不耗时':'1天')+'</small>';if(announce)showMessage('已选择'+w.name+' · '+w.event)}
function showMessage(s){const e=document.querySelector('#announce');e.textContent=s;e.classList.add('show');clearTimeout(window.messageTimer);window.messageTimer=setTimeout(()=>e.classList.remove('show'),2200)}
for(const w of realms){const button=document.createElement('button');button.className='kingdom'+(w.anomaly?' anomaly':'')+(w.cleared?' cleared':'')+(w.boss?' boss':'');button.dataset.world=w.id;button.dataset.layer=w.layer;button.dataset.event=w.event;button.style.left=w.x+'px';button.style.top=w.y+'px';button.setAttribute('aria-label',w.name+'，'+(w.cleared?'11层已完成':'当前第'+w.layer+'层，共11层')+'，'+w.event);button.innerHTML='<span class="art" style="background-position:'+((w.cell%3)*50)+'% '+(Math.floor(w.cell/3)*50)+'%"></span><span class="name">'+w.name+'</span><span class="info"><span class="floor">'+(w.cleared?'11 / 11':'第'+w.layer+'/11层')+'</span><span class="type">'+w.symbol+' '+w.event+'</span></span>'+(w.anomaly?'<span class="tag">今日</span>':w.cleared?'<span class="tag">✓ 征服</span>':'')+(w.quest?'<span class="questbadge">◇ '+w.quest+'</span>':'');button.addEventListener('click',()=>select(w.id));root.append(button)}
document.querySelector('#quest-toggle').onclick=()=>{paused=!paused;document.querySelector('#quest-state').textContent='跨界长任务 · '+(paused?'已暂停':'进行中：约顿海姆');document.querySelector('#quest-toggle').textContent=paused?'继续':'暂停';showMessage(paused?'任务已暂停，进度保留':'继续止息永冬 · 下一站：约顿海姆国');};
document.querySelector('#enter').onclick=()=>{const w=realms.find(r=>r.id===selected);showMessage(w.cleared?'已回访'+w.name+' · Boss已击败':'准备进入'+w.name+' · '+w.event)};
function fit(){const scale=Math.min(window.innerWidth/1280,window.innerHeight/720);const frame=document.querySelector('#frame');frame.style.width=(1280*scale)+'px';frame.style.height=(720*scale)+'px';document.querySelector('#game').style.transform='scale('+scale+')'}
window.addEventListener('resize',fit);fit();select('mid');
window.mapDesign={realms,select,layout:{width:1280,height:720,worldCount:9,currentNodesPerWorld:1}};
</script></body></html>
