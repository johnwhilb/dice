<div class="app">

<script>
'use strict';
const $=id=>document.getElementById(id);
const realms=[
 {id:'vana',name:'华纳海姆',en:'Vanaheim',x:.165,y:.237,w:.31,h:.25,floor:3,next:'古树花园',boss:true,color:'#4c9861',icon:'♧'},
 {id:'asgard',name:'阿斯加德',en:'Asgard',x:.831,y:.225,w:.30,h:.29,floor:6,next:'神殿高台',boss:false,color:'#d6ad39',icon:'☀'},
 {id:'alf',name:'阿尔夫海姆',en:'Alfheim',x:.59,y:.36,w:.29,h:.24,floor:5,next:'月光回廊',boss:false,color:'#9766c6',icon:'☽'},
 {id:'mid',name:'米德加德',en:'Midgard',x:.200,y:.530,w:.39,h:.25,floor:4,next:'风车平原',boss:true,color:'#43946a',icon:'♧'},
 {id:'svart',name:'斯瓦塔尔法海姆',en:'Svartalfheim',x:.828,y:.550,w:.29,h:.27,floor:5,next:'锻造遗迹',boss:true,color:'#b89139',icon:'⚒'},
 {id:'jotun',name:'约顿海姆',en:'Jotunheim',x:.515,y:.640,w:.30,h:.25,floor:2,next:'霜巨人营地',boss:false,color:'#5da6d4',icon:'♢'},
 {id:'hel',name:'赫尔海姆',en:'Helheim',x:.160,y:.818,w:.28,h:.26,floor:6,next:'亡者之河',boss:false,color:'#639186',icon:'♜'},
 {id:'nifl',name:'尼福尔海姆',en:'Niflheim',x:.490,y:.860,w:.30,h:.24,floor:3,next:'冰封长桥',boss:false,color:'#7b94ab',icon:'❄'},
 {id:'musp',name:'穆斯贝尔海姆',en:'Muspelheim',x:.828,y:.833,w:.30,h:.25,floor:7,next:'熔火之心',boss:false,color:'#d75a3e',icon:'♨'}
];
// Expanded map canvas; hotspot positions follow the spaced island artwork.
const WORLD_SPACING_FACTOR=4/3;
for(const realm of realms){realm.w/=WORLD_SPACING_FACTOR;realm.h/=WORLD_SPACING_FACTOR}
const W=2400,H=1600,vp=$('viewport'),world=$('world'),pointers=new Map();
Object.assign(world.style,{width:W+'px',height:H+'px'});
let selected=realms.find(r=>r.id==='mid'),current=selected,scale=1,fitScale=1,minScale=.1,maxScale=2.5,tx=0,ty=0,dragged=false,gesture=null,toastTimer,questPaused=false,questStage=2,seedCount=1,resizeTimer,ready=false;
function clamp(n,a,b){return Math.max(a,Math.min(n,b))}
function bounds(){const w=vp.clientWidth,h=vp.clientHeight;tx=W*scale<=w?(w-W*scale)/2:clamp(tx,w-W*scale,0);ty=H*scale<=h?(h-H*scale)/2:clamp(ty,h-H*scale,0)}
function render(){bounds();world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;$('zoom-value').value=Math.round(scale/fitScale*100)+'%';$('zoom-out').disabled=scale<=minScale+.001;$('zoom-in').disabled=scale>=maxScale-.001;const left=clamp(-tx/scale/W,0,1),top=clamp(-ty/scale/H,0,1),right=clamp((vp.clientWidth-tx)/scale/W,0,1),bottom=clamp((vp.clientHeight-ty)/scale/H,0,1);Object.assign($('mini-window').style,{left:left*100+'%',top:top*100+'%',width:(right-left)*100+'%',height:(bottom-top)*100+'%'})}
function fit(){fitScale=Math.min(vp.clientWidth/W,vp.clientHeight/H);minScale=fitScale;maxScale=Math.max(2,fitScale*4);scale=fitScale;tx=0;ty=0;render()}
function zoomAt(next,x=vp.clientWidth/2,y=vp.clientHeight/2){const s=clamp(next,minScale,maxScale);tx=x-(x-tx)*s/scale;ty=y-(y-ty)*s/scale;scale=s;render()}
function focusRealm(r=selected){scale=clamp(Math.max(fitScale*1.65,Math.min(vp.clientWidth/(W*r.w*1.6),vp.clientHeight/(H*r.h*1.6))),minScale,maxScale);tx=vp.clientWidth/2-r.x*W*scale;ty=vp.clientHeight/2-r.y*H*scale;render()}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function selectRealm(id,focus=false){const r=realms.find(r=>r.id===id);if(!r)return;selected=r;document.querySelectorAll('.realm').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.realm===id)));$('selected-name').textContent=r.name;$('selected-floor').textContent=r.floor;$('selected-next').textContent=r.next;$('selected-boss').textContent=r.boss?'已击败':'未击败';$('selected-boss').className=r.boss?'success':'danger';$('realm-jump').value=id;$('progress').style.setProperty('--realm-color',r.color);$('progress').innerHTML=Array.from({length:11},(_,i)=>`<i class="${i<r.floor?'done':''}"></i>`).join('');$('progress').setAttribute('aria-label',`已探索 ${r.floor} 层，共 11 层`);if(focus)focusRealm(r);world.dispatchEvent(new CustomEvent('realm-select',{detail:{...r},bubbles:true}))}
for(const r of realms){const b=document.createElement('button');b.className='realm';b.dataset.realm=r.id;b.type='button';b.setAttribute('aria-label',`${r.name}，第 ${r.floor} 层，${r.boss?'Boss 已击败':'Boss 未击败'}`);Object.assign(b.style,{left:(r.x-r.w/2)*100+'%',top:(r.y-r.h/2)*100+'%',width:r.w*100+'%',height:r.h*100+'%'});const pin=document.createElement('span');pin.className='pin';pin.textContent='当前选择 · '+r.name;b.append(pin);b.addEventListener('click',e=>{if(dragged){e.preventDefault();return}selectRealm(r.id)});b.addEventListener('dblclick',()=>focusRealm(r));b.addEventListener('focus',()=>{if(!pointers.size){const bx=r.x*W*scale+tx,by=r.y*H*scale+ty;if(bx<0||by<0||bx>vp.clientWidth||by>vp.clientHeight){tx=vp.clientWidth/2-r.x*W*scale;ty=vp.clientHeight/2-r.y*H*scale;render()}}});world.append(b);const opt=document.createElement('option');opt.value=r.id;opt.textContent=r.icon+' '+r.name;$('realm-jump').append(opt)}
function local(e){const rect=vp.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
function startGesture(){const ps=[...pointers.values()];if(ps.length>=2){const a=ps[0],b=ps[1];gesture={mode:'pinch',distance:Math.hypot(a.x-b.x,a.y-b.y),s:scale,wx:((a.x+b.x)/2-tx)/scale,wy:((a.y+b.y)/2-ty)/scale}}else if(ps.length===1){gesture={mode:'pan',x:ps[0].x,y:ps[0].y,tx,ty}}else gesture=null}
vp.addEventListener('pointerdown',e=>{if(e.target.closest('.view-tools,.navigator,.jump'))return;if(e.button!==0&&e.pointerType!=='touch')return;pointers.set(e.pointerId,local(e));e.target.setPointerCapture(e.pointerId);if(pointers.size===1)dragged=false;else dragged=true;startGesture();vp.classList.add('dragging')});
vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=local(e);pointers.set(e.pointerId,p);if(gesture?.mode==='pinch'&&pointers.size>=2){const[a,b]=[...pointers.values()];scale=clamp(gesture.s*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(gesture.distance,1),minScale,maxScale);tx=(a.x+b.x)/2-gesture.wx*scale;ty=(a.y+b.y)/2-gesture.wy*scale;dragged=true;render()}else if(gesture?.mode==='pan'){const dx=p.x-gesture.x,dy=p.y-gesture.y;if(Math.hypot(dx,dy)>5)dragged=true;if(dragged){tx=gesture.tx+dx;ty=gesture.ty+dy;render()}}});
function endPointer(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);startGesture();if(!pointers.size){vp.classList.remove('dragging');setTimeout(()=>{dragged=false},0)}}
vp.addEventListener('pointerup',endPointer);vp.addEventListener('pointercancel',endPointer);vp.addEventListener('lostpointercapture',endPointer);
vp.addEventListener('wheel',e=>{if(e.target.closest('select'))return;e.preventDefault();const p=local(e);if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)>35){zoomAt(scale*Math.exp(-e.deltaY*.0015),p.x,p.y)}else{tx-=e.deltaX;ty-=e.deltaY;render()}},{passive:false});
vp.addEventListener('keydown',e=>{if(e.target.closest('button,select'))return;const actions={ArrowLeft:()=>{tx+=85;render()},ArrowRight:()=>{tx-=85;render()},ArrowUp:()=>{ty+=85;render()},ArrowDown:()=>{ty-=85;render()},'+':()=>zoomAt(scale*1.2),'=':()=>zoomAt(scale*1.2),'-':()=>zoomAt(scale/1.2),Home:fit};if(actions[e.key]){e.preventDefault();actions[e.key]()}});
$('zoom-in').onclick=()=>zoomAt(scale*1.25);$('zoom-out').onclick=()=>zoomAt(scale/1.25);$('fit').onclick=fit;$('back').onclick=fit;$('locate').onclick=()=>focusRealm();$('realm-jump').onchange=e=>selectRealm(e.target.value,true);
function miniLocate(e){const r=$('mini').getBoundingClientRect();tx=vp.clientWidth/2-clamp((e.clientX-r.left)/r.width,0,1)*W*scale;ty=vp.clientHeight/2-clamp((e.clientY-r.top)/r.height,0,1)*H*scale;render()}
$('mini').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();$('mini').setPointerCapture(e.pointerId);if(scale<fitScale*1.2)scale=fitScale*1.8;miniLocate(e)});$('mini').addEventListener('pointermove',e=>{if($('mini').hasPointerCapture(e.pointerId))miniLocate(e)});
function showDialog(html){$('dialog-body').innerHTML=html;$('dialog').showModal()}
$('close-dialog').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}});
const helpHTML='<h2>循着世界树探索九界</h2><p>鼠标按住地图拖动，或在触屏上单指滑动；滚轮与双指捏合可放大、缩小。触控板双指轻扫可以平移。</p><p>点击浮岛选择世界，下方会显示探索层数、下一个节点与 Boss 状态。双击浮岛或点击 ⌖ 可定位；“查看全图”会展示完整九界。</p><p>右下角缩略图可点击或拖动导航。键盘方向键移动，＋ / − 缩放，Home 回到全图。</p><small>这是本地交互原型。资源、层数和任务进度用于界面演示，“进入世界”打开世界预览并发出 realm-enter 事件。</small>';
$('help').onclick=()=>showDialog(helpHTML);$('rules').onclick=()=>showDialog('<h2>九界探索规则</h2><p>九个世界各有 11 层探索节点。选择一个浮岛，在底部查看其进度与下一站。</p><p>60 天旅程分为正常阶段（1—20 天）、崩坏阶段 I（21—40 天）和崩坏阶段 II（41—60 天）。</p><p>跨界长线任务：寻找三枚世界之种碎片，重新唤醒世界树。</p><small>此 HTML 展示地图与 UI 交互；战斗、事件和资源结算等待接入实际游戏。</small>');
$('settings').onclick=()=>{showDialog(helpHTML+'<label><input id="show-mini" type="checkbox" '+(!$('mini').parentElement.hidden?'checked':'')+'>显示缩略导航</label>');$('show-mini').onchange=e=>$('mini').parentElement.hidden=!e.target.checked};
$('enter').onclick=()=>{current=selected;$('current-location').textContent='◆ '+current.name;const detail={id:current.id,name:current.name,floor:current.floor,next:current.next};window.dispatchEvent(new CustomEvent('realm-enter',{detail}));showDialog(`<h2>${current.icon} ${current.name}</h2><p style="color:var(--blue)">${current.en} · 第 ${current.floor} / 11 层</p><p>下一站：${current.next}</p><p>守关 Boss：<span class="${current.boss?'success':'danger'}">${current.boss?'已击败':'未击败'}</span></p><small>世界预览已打开。后续可在此接入探索节点与战斗场景。</small><p><button id="return-map">返回地图</button></p>`);$('return-map').onclick=()=>$('dialog').close()};
$('quest-toggle').onclick=()=>{questPaused=!questPaused;$('quest-state').textContent=questPaused?'已暂停':'进行中';$('quest-toggle').textContent=questPaused?'继续':'暂停';$('quest-state').style.background=questPaused?'#d9d1bb':'#a9cbd6'};
$('quest-next').onclick=()=>{if(questPaused){notify('任务已暂停，请先点击“继续”。');return}if(questStage>=4){notify('世界之种已集齐，世界树重新苏醒。');return}questStage++;seedCount=Math.min(3,seedCount+1);$('quest-count').textContent=seedCount;$('quest-stage').textContent=questStage;$('quest-target').textContent=questStage===3?'阿尔夫海姆':'世界树之心';if(questStage===4){$('quest-state').textContent='已完成';$('quest-next').disabled=true;$('quest-toggle').disabled=true}notify(questStage===4?'世界之种已集齐！':'已获得一枚种子碎片。')};
new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!ready)return;const oldFit=fitScale,oldScale=scale,cx=(vp.clientWidth/2-tx)/scale,cy=(vp.clientHeight/2-ty)/scale;fitScale=Math.min(vp.clientWidth/W,vp.clientHeight/H);minScale=fitScale;maxScale=Math.max(2,fitScale*4);if(Math.abs(oldScale-oldFit)<.01)fit();else{scale=clamp(oldScale,minScale,maxScale);tx=vp.clientWidth/2-cx*scale;ty=vp.clientHeight/2-cy*scale;render()}},80)}).observe(vp);
$('mini-art').src=$('map-art').src;
selectRealm('mid');fit();ready=true;
window.nineRealmsExplorer={realms,select:(id)=>selectRealm(id,true),fit,focus:focusRealm,get selected(){return selected.id},get camera(){return{scale,fitScale,x:tx,y:ty,width:W,height:H}}};
</script>
